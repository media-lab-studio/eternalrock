services:
  navidrome:
    image: deluan/navidrome:latest
    container_name: navidrome
    ports:
      - "4533:4533"
    environment:
      ND_SCANSCHEDULE: 1h
      ND_LOGLEVEL: info
      ND_SESSIONTIMEOUT: 24h
    volumes:
      - "D:\\My_project\\EternalRock Project\\data:/data"
      - "D:\\Музыка\\Rock\\Сборники\\Classic Rock:/music:ro"
    restart: unless-stopped